# we use _ for the yaml file to make sure it appears at the top of the directory
sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop  #database and schema names mutch exactly match (case sensitive)
    description: A Clone of a postgress application database
    tables:
      - name: customers
        description : raw customers data from jaffle shop app
        columns:
          - name: id
            description : primary key for customers table
            tests:
              - unique
              - not_null

      - name: orders
        description : raw orders data from jaffle shop app
        columns:
          - name: id
            description : primary key for orders table
            tests:
              - unique
              - not_null
        freshness:
          warn_after:
            count: 12
            period: hour
          error_after: 
            count: 1
            period: day
        loaded_at_field: _etl_loaded_at

