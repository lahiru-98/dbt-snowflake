version: 2

models:
  - name: stg_jaffle_shop__customers
    description: The grain of this table is one unique customer. per row
    columns:
      - name: customer_id
        description: primary key for customers table
        tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    description: The grain of this table is one unique order. per row
    columns:
      - name: order_id
        description: primary key for orders table
        tests:
          - unique
          - not_null

      - name: status
        description: "Status of the order"
        tests:
          - accepted_values:
              values:
                - completed
                - cancelled
                - pending

      - name: customer_id
        tests:
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
